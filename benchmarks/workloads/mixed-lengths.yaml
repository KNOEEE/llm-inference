name: mixed-lengths
seed: 42
model: Qwen/Qwen3-0.6B
concurrency: [1, 4, 8, 16]
request_distribution:
  - weight: 0.50
    prompt_tokens_target: 128
    output_tokens_target: 64
  - weight: 0.30
    prompt_tokens_target: 512
    output_tokens_target: 128
  - weight: 0.20
    prompt_tokens_target: 2048
    output_tokens_target: 64

